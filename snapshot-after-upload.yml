      - generic [ref=e149]:
        - heading "About Schematics" [level=3] [ref=e150]
        - paragraph [ref=e151]:
          - text: Schematics are exported as JSON files mapping
          - code [ref=e152]: (x, y)
          - text: coordinates to Minecraft block IDs.
          - strong [ref=e153]: X
          - text: represents the horizontal position (width) and
          - strong [ref=e154]: "Y"
          - text: represents the vertical position (height). The coordinates are 0-indexed, with
          - code [ref=e155]: (0, 0)
          - text: located at the top-left corner of the map.
          - text: Each individual map represents exactly a 128×128 block area. For multi-map setups, a separate
          - code [ref=e156]: <name>_<x>-<y>.json
          - text: file is generated for each map piece in the grid.
          - strong [ref=e157]: NBT
          - text: exports a vanilla Minecraft structure file. In Carpet mode it includes a
          - code [ref=e158]: minecraft:cobblestone
          - text: support layer beneath the carpets. Each 128×128 file exceeds the Structure Block's 48×48 cap, so load it with
          - code [ref=e159]: /place template <name>
          - text: after placing the file under
          - code [ref=e160]: <save>/generated/minecraft/structures/
          - text: .
